name: Build ChandSaat Apps (Desktop & Android)

on:
  push:
    branches: [ "main", "master", "feature/android-build" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Inno Setup Compiler via Chocolatey
        run: |
          choco install innosetup --no-progress -y

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Release Build Script
        run: |
          python make_release.py

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChandSaat-Desktop-Release
          path: |
            installer/ChandSaat_Setup_v*.exe
            installer/ChandSaat_v*_Portable.zip

      - name: Release Desktop Assets (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            installer/ChandSaat_Setup_v*.exe
            installer/ChandSaat_v*_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www/static
          cp templates/index.html www/index.html
          cp -r static/* www/static/
          cp icon.png www/icon.png
          cp splash_android.png www/splash_android.png

      - name: Install Capacitor Dependencies
        run: |
          npm install

      - name: Add Android Platform & Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Native Android Icons, Splash & System Colors
        run: |
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/drawable-port-hdpi
          mkdir -p android/app/src/main/res/drawable-port-mdpi
          mkdir -p android/app/src/main/res/drawable-port-xhdpi
          mkdir -p android/app/src/main/res/drawable-port-xxhdpi
          mkdir -p android/app/src/main/res/drawable-port-xxxhdpi

          cp splash_android.png android/app/src/main/res/drawable/splash.png
          cp splash_android.png android/app/src/main/res/drawable-port-hdpi/splash.png
          cp splash_android.png android/app/src/main/res/drawable-port-mdpi/splash.png
          cp splash_android.png android/app/src/main/res/drawable-port-xhdpi/splash.png
          cp splash_android.png android/app/src/main/res/drawable-port-xxhdpi/splash.png
          cp splash_android.png android/app/src/main/res/drawable-port-xxxhdpi/splash.png

          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#4F46E5</item>
                  <item name="colorPrimaryDark">#FFFFFF</item>
                  <item name="colorAccent">#4F46E5</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">#EEF5FD</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@drawable/splash</item>
              </style>
          </resources>
          EOF

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChandSaat-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release Android APK (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
