name: Build ChandSaat Apps (Desktop & Android)

on:
  push:
    branches: [ "main", "master", "feature/android-build" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Inno Setup Compiler via Chocolatey
        run: |
          choco install innosetup --no-progress -y

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Release Build Script
        run: |
          python make_release.py

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChandSaat-Desktop-Release
          path: |
            installer/ChandSaat_Setup_v*.exe
            installer/ChandSaat_v*_Portable.zip

      - name: Release Desktop Assets (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            installer/ChandSaat_Setup_v*.exe
            installer/ChandSaat_v*_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www/static
          cp templates/index.html www/index.html
          cp -r static/* www/static/
          cp icon.png www/icon.png
          cp splash_android.png www/splash_android.png

      - name: Install Capacitor Dependencies
        run: |
          npm install

      - name: Add Android Platform & Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChandSaat-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release Android APK (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
