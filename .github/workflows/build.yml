name: Build ChandSaat Desktop App

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Inno Setup Compiler via Chocolatey
        run: |
          choco install innosetup --no-progress -y

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Release Build Script
        run: |
          python make_release.py

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChandSaat-Release
          path: |
            installer/ChandSaat_Setup_v*.exe
            installer/ChandSaat_v*_Portable.zip

      - name: Release Assets (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            installer/ChandSaat_Setup_v*.exe
            installer/ChandSaat_v*_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
